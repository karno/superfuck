[package]
name = "superfuck"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.39", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "6.0.0"
futures-util = "0.3.31"
indexmap = { version = "2.10.0", features = ["serde"] }
indicatif = "0.18.4"
llm = { version = "1.3.7", features = ["anthropic", "google", "openai"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["macros", "rt", "time"] }
toml = "1.1.0"
